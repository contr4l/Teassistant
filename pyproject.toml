[project]
name = "teassistant"
version = "0.1.0"
description = "初中数学智能备课 P0 验证工具"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "networkx>=3.4,<4",
  "python-docx>=1.1,<2",
  "Pillow>=11,<13",
  "lxml>=5,<7",
  "olefile>=0.47,<1",
  "pypdfium2==5.14.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "celery[redis]>=5.5,<6",
]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8.3,<10",
 "pytest-asyncio>=0.25,<2",
 "ruff>=0.9,<1",
]
export = [
    "mathtypejx",
    "pypandoc-binary>=1.17,<2",
    "playwright>=1.50,<2",
]
api = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "networkx>=3.4,<4",
    "python-docx>=1.1,<2",
    "Pillow>=11,<13",
    "lxml>=5,<7",
    "olefile>=0.47,<1",
    "pypdfium2==5.14.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false

[tool.uv.sources]
mathtypejx = { git = "https://github.com/uwjiaoxing/mathtype2omml", rev = "7f1b46358a3a7b0b5c992faa0dca91740a54efbb" }
